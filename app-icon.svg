<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <rect x="76" y="96" width="360" height="320" rx="32" fill="#0f172a" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6" />
  
  <!-- Notebook lines -->
  <line x1="126" y1="160" x2="386" y2="160" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="126" y1="210" x2="340" y2="210" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4" />
  <line x1="126" y1="260" x2="386" y2="260" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4" />
  <line x1="126" y1="310" x2="300" y2="310" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- Apple Pencil style stylus drawing an energetic curve -->
  <path d="M 120 360 Q 200 310, 260 370 T 390 330" fill="none" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" />
  
  <g transform="translate(320, 180) rotate(45)">
    <rect x="-16" y="-80" width="32" height="130" rx="16" fill="url(#penGrad)" stroke="#64748b" stroke-width="4" />
    <polygon points="-14,50 14,50 0,85" fill="#f59e0b" />
    <polygon points="-5,73 5,73 0,85" fill="#1e293b" />
    <circle cx="0" cy="-60" r="6" fill="#3b82f6" />
  </g>
</svg>
